services:

  # =====================================================
  # GYMBUDDY WEB APPLICATION
  # =====================================================

  web:
    build:
      context: .
      dockerfile: Dockerfile

    working_dir: /app

    ports:
      - "3000:3000"

    env_file:
      - .env

    environment:
      NODE_ENV: production

    volumes:
      - uploads_data:/app/src/public/uploads

    depends_on:
      db:
        condition: service_healthy

    restart: unless-stopped


  # =====================================================
  # MYSQL DATABASE
  # =====================================================

  db:
    image: mysql:8.0

    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}

      MYSQL_DATABASE: ${DB_NAME}

      MYSQL_USER: ${DB_USER}

      MYSQL_PASSWORD: ${DB_PASSWORD}

    # IMPORTANT:
    # No host port is exposed in production.
    #
    # GymBuddy connects internally using:
    #
    # DB_HOST=db
    # DB_PORT=3306

    volumes:
      - db_data:/var/lib/mysql

      # Production creates the database schema only.
      # Development seed data is intentionally excluded.
      - ./src/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent"
        ]

      interval: 10s

      timeout: 5s

      retries: 10

      start_period: 30s


# =====================================================
# PERSISTENT STORAGE
# =====================================================

volumes:

  # MySQL database files
  db_data:

  # User-uploaded profile and workout images
  uploads_data: